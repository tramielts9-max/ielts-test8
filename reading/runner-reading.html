<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IELTS Reading Examination - Trạm IELTS</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="css-r/reading.css">

  <style>
    .container {
      height: calc(100vh - 195px) !important;
      margin-bottom: 60px;
    }

    /* CARD GHI CHÚ SOCRATIC & THOUGHT BOX (GIỮ NGUYÊN GỐC) */
    .unified-notes-card {
      background: #FFFFFF;
      border: 2px solid #0284C7;
      border-radius: 16px;
      padding: 18px 22px;
      margin-bottom: 20px;
      line-height: 1.75;
      font-size: 14.5px;
    }
    .unified-notes-card h3 {
      margin-top: 0;
      color: #8B1518;
      font-weight: 900;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 8px;
      margin-bottom: 12px;
      font-size: 16px;
    }

    .fill-input {
      font-family: inherit; font-size: 14.5px; font-weight: 800; color: #8B1518;
      background: #FFFFFF; border: 2px solid #CBD5E1; border-bottom: 3.5px solid #94A3B8;
      border-radius: 10px; padding: 5px 12px; text-align: center; outline: none; margin: 0 4px;
    }
    .fill-input:focus { border-color: #8B1518; background: #FFFDF0; }

    /* THANH ĐIỀU HƯỚNG ĐÁY */
    .bottom-nav-bar {
      position: fixed; bottom: 0; left: 0; width: 100%; height: 56px; background: #FFFFFF;
      border-top: 2.5px solid var(--border-color); display: flex; align-items: center; justify-content: space-between;
      padding: 0 18px; box-shadow: 0 -4px 16px rgba(0,0,0,0.06); z-index: 1000; box-sizing: border-box; gap: 12px;
    }
    .btn-nav-arrow {
      background: #1E293B; color: #FFFFFF; border: none; width: 34px; height: 34px;
      border-radius: 10px; font-size: 16px; cursor: pointer; display: inline-flex;
      align-items: center; justify-content: center; flex-shrink: 0; font-weight: 900;
    }
    .passages-container { display: flex; align-items: center; gap: 10px; overflow-x: auto; flex: 1; padding: 2px 4px; }
    .passage-group-tab { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; padding: 4px 10px; border-radius: 12px; font-size: 13px; }
    .passage-group-tab.active-tab { border: 2px solid #F8B4B7; background: #FDEDEE; }
    .passage-group-tab.inactive-tab {
      border: 1.5px solid var(--border-color); background: #FAF7F2; color: var(--text-muted); cursor: pointer;
      padding: 6px 14px; font-weight: 800; transition: all 0.1s;
    }
    .passage-group-tab.inactive-tab:hover { border-color: #8B1518; color: #8B1518; background: #FFFFFF; }

    .q-badge-btn {
      width: 32px; height: 32px; border-radius: 8px; border: 2px solid var(--border-color);
      border-bottom: 3.5px solid var(--border-shadow); background: #FFFFFF; color: var(--text-main);
      font-weight: 900; font-size: 12.5px; cursor: pointer; flex-shrink: 0; transition: all 0.08s ease;
    }
    .q-badge-btn:hover { border-color: #8B1518; color: #8B1518; }
    .q-badge-btn.status-answered { background: #64748B !important; color: #FFFFFF !important; border-color: #475569 !important; }
    .q-badge-btn.status-correct { background: #22C55E !important; color: #FFFFFF !important; border-color: #16A34A !important; border-bottom-color: #15803D !important; }
    .q-badge-btn.status-incorrect { background: #8B1518 !important; color: #FFFFFF !important; border-color: #630D10 !important; border-bottom-color: #45080A !important; }

    .btn-sheet-toggle {
      background: #FFFFFF; color: #0284C7; border: 2px solid #BAE6FD; border-bottom: 3.5px solid #7DD3FC;
      padding: 8px 14px; border-radius: 12px; cursor: pointer; font-weight: 900; white-space: nowrap; font-size: 13.5px;
    }
    .btn-submit-bar {
      background: #22C55E; color: #FFFFFF; border: none; border-bottom: 4.5px solid #15803D;
      padding: 9px 20px; border-radius: 14px; font-weight: 900; cursor: pointer; white-space: nowrap; font-size: 14px;
      text-transform: uppercase; letter-spacing: 0.3px; transition: all 0.08s ease;
    }
    .btn-submit-bar:active { transform: translateY(2px); border-bottom-width: 2px; }

    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(4px);
      display: none; align-items: center; justify-content: center; z-index: 9999; padding: 16px;
    }
    .modal-content-card {
      background: #FFFFFF; width: 100%; max-width: 660px; max-height: 88vh; border-radius: 22px;
      border: 2.5px solid var(--border-color); border-bottom: 6px solid var(--border-shadow);
      padding: 24px; position: relative; overflow-y: auto;
    }
    .modal-close-btn {
      position: absolute; top: 16px; right: 18px; background: transparent; border: none; font-size: 24px;
      cursor: pointer; color: var(--text-muted); font-weight: 900;
    }
  </style>
</head>
<body>

<div class="user-info-box" style="background:#FFFFFF; border:2px solid var(--border-color); border-bottom:4px solid var(--border-shadow); border-radius:18px; padding:12px 20px; max-width:1250px; margin:14px auto; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
  <div style="display:flex; gap:16px; flex-wrap:wrap; align-items:center;">
    <div style="display:flex; align-items:center; gap:6px;">
      <b style="font-size:13.5px;">Họ và Tên:</b>
      <input type="text" id="studentNameInput" placeholder="Đang đồng bộ..." style="padding:6px 12px; border:1.5px solid var(--border-color); border-radius:8px; font-weight:700; font-size:13.5px;">
    </div>
    <div style="display:flex; align-items:center; gap:6px;">
      <b style="font-size:13.5px;">Email Google:</b>
      <input type="email" id="studentEmailInput" placeholder="Đang đồng bộ..." style="padding:6px 12px; border:1.5px solid var(--border-color); border-radius:8px; font-weight:700; font-size:13.5px;">
    </div>
  </div>

  <div style="display:flex; align-items:center; gap:10px;">
    <a href="reading.html" class="btn-3d btn-3d-white" style="padding:8px 16px; font-size:13px;">← Danh mục Đề</a>
    <a href="../index.html" class="btn-3d btn-3d-white" style="padding:8px 16px; font-size:13px;">Trang chủ</a>
  </div>
</div>

<div class="header-bar" style="background:#FFFFFF; border:2px solid var(--border-color); border-bottom:4px solid var(--border-shadow); border-radius:18px; padding:12px 22px; max-width:1250px; margin:0 auto 16px auto; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
  <h1 id="testTitleHeader" style="margin:0; font-size:19px; font-weight:900; color:var(--rd-red);">IELTS Reading Test</h1>
  
  <div style="display:flex; align-items:center; gap:10px;">
    <div style="display:flex; align-items:center; gap:6px; background:#FAF7F2; padding:6px 12px; border-radius:12px; border:1.5px solid var(--border-color); font-weight:800; font-size:13.5px;">
      <span>Thời gian:</span>
      <span class="timer-display" id="timerDisplay" style="color:#D97706; font-size:15px;">00:00</span>
      <button type="button" onclick="window.startTimer && window.startTimer()" style="background:#22C55E; color:white; border:none; padding:4px 8px; border-radius:6px; font-weight:bold; cursor:pointer; font-size:12px;">▶ Bắt đầu</button>
      <button type="button" onclick="window.pauseTimer && window.pauseTimer()" style="background:#F59E0B; color:white; border:none; padding:4px 8px; border-radius:6px; font-weight:bold; cursor:pointer; font-size:12px;">⏸ Tạm dừng</button>
    </div>

    <div class="score-badge" id="scoreBadge" style="display:none; background:#DCFCE7; color:#166534; border:1.5px solid #86EFAC; padding:6px 14px; border-radius:12px; font-weight:900; font-size:14px;">
      Điểm số: <span id="scoreText">0/13</span>
    </div>
  </div>
</div>

<div class="container" id="mainContainer">
  <div class="passage-box" id="passageBox">
    <div style="text-align:center; padding: 40px; color: var(--text-muted); font-weight: 800; font-size: 14.5px;">⏳ Đang tải nội dung bài đọc...</div>
  </div>
  <div class="resizer" id="dragResizer"></div>
  <div class="question-box" id="questionBox">
    <div style="text-align:center; padding: 40px; color: var(--text-muted); font-weight: 800; font-size: 14.5px;">⏳ Đang tải câu hỏi...</div>
  </div>
</div>

<div class="bottom-nav-bar" id="readingBottomBar">
  <div style="display: flex; align-items: center; gap: 6px;">
    <button type="button" class="btn-nav-arrow" id="btnPrevQ" title="Câu trước">←</button>
    <button type="button" class="btn-nav-arrow" id="btnNextQ" title="Câu sau">→</button>
  </div>
  <div class="passages-container" id="passagesNavContainer"></div>
  <div style="display: flex; align-items: center; gap: 8px;">
    <button type="button" class="btn-sheet-toggle" id="btnOpenSheet" title="Xem bảng đáp án">Bảng đáp án 📋</button>
    <button type="button" class="btn-submit-bar" id="btnBottomSubmit" onclick="window.checkAnswers()">Nộp bài & Chấm điểm &rarr;</button>
  </div>
</div>

<div class="modal-backdrop" id="readingModalBackdrop">
  <div class="modal-content-card">
    <button type="button" class="modal-close-btn" id="btnCloseModal">&times;</button>
    <div id="modalDynamicBody"></div>
  </div>
</div>

<script type="module">
  import { buildReadingHtml } from './js-r/reading-builder.js';
  import { initReadingApp } from './js-r/app-r.js';

  const params = new URLSearchParams(window.location.search);
  let testId = params.get('test');

  if (!testId) {
    alert("⚠️ Không tìm thấy mã đề thi!");
    window.location.href = 'reading.html';
  } else {
    async function loadTest() {
      const raw = testId.replace(/\.json$/i, '');
      const fileName = raw.includes('/') ? raw.split('/').pop() : raw;
      const folderName = fileName.replace(/-p\d+.*$/i, '');

      const urlsToTry = [
        `data-r/${folderName}/${fileName}.json`,
        `data-r/${fileName}.json`,
        `${raw}.json`,
        `data-r/${raw}.json`,
        `../data/${folderName}/${fileName}.json`
      ];

      let data = null;
      for (const url of urlsToTry) {
        try {
          const res = await fetch(`${url}?t=${Date.now()}`, { cache: 'no-store' });
          if (res.ok) {
            data = await res.json();
            break;
          }
        } catch (e) {}
      }

      if (!data) {
        document.getElementById('mainContainer').innerHTML = `
          <div style="padding: 40px; text-align: center; width: 100%; background:#FFFFFF; border-radius:20px; border:2px solid var(--border-color);">
            <h3 style="color: #DC2626; font-size:18px;">❌ Không tìm thấy file: <code>${fileName}.json</code></h3>
            <p style="color: var(--text-muted); font-size:14px;">Hãy kiểm tra lại xem file đã nằm trong thư mục <code>reading/data-r/</code> chưa.</p>
            <a href="reading.html" style="color:#8B1518; font-weight:800;">← Quay về danh mục đề đọc</a>
          </div>
        `;
        return;
      }

      document.title = data.title;
      document.getElementById('testTitleHeader').innerText = data.title;
      document.getElementById('passageBox').innerHTML = data.passageHtml || "";

      if (data.questions) {
        document.getElementById('questionBox').innerHTML = buildReadingHtml(data);
      }

      window.TEST_DATA = { 
        title: data.title, 
        answers: data.answers || (data.questions ? Object.fromEntries(Object.entries(data.questions).map(([k, v]) => [k, v.finalAnswer])) : {})
      };

      const qKeys = Object.keys(window.TEST_DATA.answers || {});
      const passagesContainer = document.getElementById('passagesNavContainer');
      let currentActiveIndex = 0;

      let currentPassageNum = 1;
      const matchPassage = fileName.match(/-p(\d+)/i);
      if (matchPassage) currentPassageNum = parseInt(matchPassage[1], 10);

      if (passagesContainer) {
        let passagesHtml = '';
        for (let p = 1; p <= 3; p++) {
          if (p === currentPassageNum) {
            const badgesHtml = qKeys.map((k, idx) => {
              const num = k.replace(/^[a-zA-Z]+/, '');
              return `<button type="button" class="q-badge-btn" id="badge_${k}" data-idx="${idx}">${num}</button>`;
            }).join('');

            passagesHtml += `
              <div class="passage-group-tab active-tab">
                <b style="color:#8B1518; margin-right:4px;">Passage ${p}:</b> ${badgesHtml}
              </div>
            `;
          } else {
            const targetUrl = window.location.href.replace(new RegExp(`-p${currentPassageNum}`, 'i'), `-p${p}`);
            passagesHtml += `
              <div class="passage-group-tab inactive-tab" onclick="window.location.href='${targetUrl}'">
                <b>Passage ${p}</b> (13-14 câu)
              </div>
            `;
          }
        }
        passagesContainer.innerHTML = passagesHtml;

        function scrollToQ(idx) {
          if (idx < 0 || idx >= qKeys.length) return;
          currentActiveIndex = idx;
          const targetId = qKeys[idx];
          const el = document.getElementById(targetId) || document.getElementById(`${targetId}_input`);
          if (el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            const inputEl = document.getElementById(`${targetId}_input`);
            if (inputEl) setTimeout(() => inputEl.focus(), 250);
          }
        }

        qKeys.forEach((k, idx) => {
          document.getElementById(`badge_${k}`)?.addEventListener('click', () => scrollToQ(idx));
        });

        document.getElementById('btnPrevQ')?.addEventListener('click', () => scrollToQ(currentActiveIndex - 1));
        document.getElementById('btnNextQ')?.addEventListener('click', () => scrollToQ(currentActiveIndex + 1));
      }

      // MODAL REVIEW BẢNG ĐÁP ÁN (GIỮ NGUYÊN GỐC 100%)
      const modalBackdrop = document.getElementById('readingModalBackdrop');
      const modalBody = document.getElementById('modalDynamicBody');
      document.getElementById('btnOpenSheet')?.addEventListener('click', () => {
        let rowsHtml = '';
        qKeys.forEach(k => {
          const num = k.replace(/^[a-zA-Z]+/, '');
          const textInp = document.getElementById(`${k}_input`);
          const radio = document.querySelector(`input[name="${k}"]:checked`);
          const val = textInp ? textInp.value.trim() : (radio ? radio.value : '');

          rowsHtml += `
            <tr style="border-bottom: 1px solid var(--border-color);">
              <td style="padding: 10px 14px; font-weight:800; width:50px; text-align:center;">${num}</td>
              <td style="padding: 10px 14px; color: ${val ? '#261F1D' : '#756D68'}; font-weight:700;">
                ${val || '<span style="color:#94A3B8; font-style:italic;">(Chưa trả lời)</span>'}
              </td>
            </tr>
          `;
        });

        modalBody.innerHTML = `
          <h3 style="margin-top:0; font-size:18px; font-weight:900; color:#8B1518;">📋 Bảng Đáp Án - Passage ${currentPassageNum}</h3>
          <div style="max-height: 55vh; overflow-y: auto; border: 2px solid var(--border-color); border-radius: 14px;">
            <table style="width: 100%; border-collapse: collapse; font-size: 14.5px;">
              <thead>
                <tr style="background:#FAF7F2; border-bottom:2px solid var(--border-color);">
                  <th style="padding: 10px; width:50px;">#</th>
                  <th style="padding: 10px; text-align:left;">Đáp án của em</th>
                </tr>
              </thead>
              <tbody>${rowsHtml}</tbody>
            </table>
          </div>
        `;
        modalBackdrop.style.display = 'flex';
      });

      document.getElementById('btnCloseModal')?.addEventListener('click', () => {
        modalBackdrop.style.display = 'none';
      });
      modalBackdrop?.addEventListener('click', (e) => {
        if (e.target === modalBackdrop) modalBackdrop.style.display = 'none';
      });

      await initReadingApp();

      // GIỮ NGUYÊN GỐC 100% MODAL HIỂN THỊ KẾT QUẢ ĐÚNG / SAI KÈM MÀU XANH / ĐỎ
      const originalCheckAnswers = window.checkAnswers;
      window.checkAnswers = async function() {
        if (typeof originalCheckAnswers === 'function') await originalCheckAnswers();

        let correctCount = 0;
        let tableRows = '';

        qKeys.forEach(k => {
          const num = k.replace(/^[a-zA-Z]+/, '');
          const expected = window.TEST_DATA.answers[k];
          const textInp = document.getElementById(`${k}_input`);
          const radio = document.querySelector(`input[name="${k}"]:checked`);
          const val = textInp ? textInp.value.trim() : (radio ? radio.value : '');

          let isCorrect = false;
          if (radio) {
            isCorrect = (val.toUpperCase() === String(expected).trim().toUpperCase());
          } else {
            const cleanVal = val.toLowerCase().replace(/\s+/g, ' ');
            if (Array.isArray(expected)) {
              isCorrect = expected.map(a => a.toLowerCase().trim()).includes(cleanVal);
            } else {
              isCorrect = (cleanVal === String(expected).toLowerCase().trim());
            }
          }

          if (isCorrect) correctCount++;

          const expStr = Array.isArray(expected) ? expected.join(' / ') : expected;
          tableRows += `
            <tr style="background: ${isCorrect ? '#F0FDF4' : '#FFF5F5'}; border-bottom: 1px solid var(--border-color);">
              <td style="padding: 10px; text-align: center; font-weight: 800;">${num}</td>
              <td style="padding: 10px; font-weight: 700; color: ${isCorrect ? '#166534' : '#991B1B'};">${val || '—'}</td>
              <td style="padding: 10px; font-weight: 800; color: #166534;">${expStr}</td>
            </tr>
          `;
        });

        const total = qKeys.length;
        const timeSpent = document.getElementById('timerDisplay')?.innerText || '00:00';

        modalBody.innerHTML = `
          <div style="text-align: center; margin-bottom: 18px;">
            <h2 style="color: #8B1518; font-size: 24px; font-weight:900; margin: 0 0 6px 0;">🎉 KẾT QUẢ BÀI LÀM</h2>
            <div style="font-size: 22px; font-weight: 900; color: #261F1D;">${correctCount} / ${total} câu đúng</div>
            <div style="font-size: 14px; font-weight: 700; color: var(--text-muted); margin-top: 4px;">Thời gian hoàn thành: <b>${timeSpent}</b></div>
          </div>

          <div style="max-height: 52vh; overflow-y: auto; border: 2px solid var(--border-color); border-radius: 14px;">
            <table style="width: 100%; border-collapse: collapse; font-size: 14px;">
              <thead>
                <tr style="background: #FAF7F2; border-bottom: 2px solid var(--border-color);">
                  <th style="padding: 10px; text-align: center;">#</th>
                  <th style="padding: 10px; text-align: left;">Đáp án của em</th>
                  <th style="padding: 10px; text-align: left;">Đáp án chuẩn</th>
                </tr>
              </thead>
              <tbody>${tableRows}</tbody>
            </table>
          </div>
        `;
        modalBackdrop.style.display = 'flex';
      };
    }

    loadTest();
  }
</script>
</body>
</html>
