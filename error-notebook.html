<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doc Sửa Lỗi - Trạm IELTS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-cream: #FAF7F2;
      --duo-border: #E8E2D8;
      --duo-shadow: #D3CBC0;
      --tram-red: #8B1518;
      --text-main: #261F1D;
      --text-muted: #756D68;
    }
    body {
      background-color: var(--bg-cream);
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0; padding: 20px 16px;
      color: var(--text-main);
    }
    .container { max-width: 980px; margin: 0 auto; }
    .top-nav {
      display: flex; justify-content: space-between; align-items: center;
      background: white; border: 2.5px solid var(--duo-border); border-bottom: 5px solid var(--duo-shadow);
      border-radius: 20px; padding: 14px 22px; margin-bottom: 22px; flex-wrap: wrap; gap: 10px;
    }
    .btn-action {
      background: #8B1518; color: white; border: none; border-bottom: 4px solid #5E0C0E;
      padding: 10px 18px; border-radius: 14px; font-weight: 800; text-decoration: none;
      cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-size: 14px;
    }
    .btn-action:active { transform: translateY(2px); border-bottom-width: 2px; }
    .btn-secondary {
      background: white; color: var(--text-main); border: 2px solid var(--duo-border); border-bottom: 4px solid var(--duo-shadow);
    }
    .card {
      background: white; border: 2.5px solid var(--duo-border); border-bottom: 5px solid var(--duo-shadow);
      border-radius: 20px; padding: 22px; margin-bottom: 22px;
    }
    .input-field {
      width: 100%; box-sizing: border-box; padding: 12px 14px; border: 2px solid var(--duo-border);
      border-radius: 12px; font-family: inherit; font-size: 14px; margin-bottom: 12px; font-weight: 700;
    }
    .filter-btn {
      padding: 6px 14px; border-radius: 12px; font-weight: 800; font-size: 13px; cursor: pointer;
      border: 2px solid var(--duo-border); background: white; color: var(--text-muted);
    }
    .filter-btn.active {
      background: var(--tram-red); color: white; border-color: #5E0C0E;
    }
    .error-card {
      background: #FFFFFF; border: 2px solid var(--duo-border); border-bottom: 4px solid var(--duo-shadow);
      border-radius: 16px; padding: 16px 20px; margin-bottom: 14px;
    }
    @media print {
      .no-print { display: none !important; }
      body { background: white; padding: 0; }
      .card, .error-card { border: 1px solid #ccc; box-shadow: none; }
    }
  </style>
</head>
<body>
<div class="container">
  <!-- TOP NAV -->
  <div class="top-nav no-print">
    <div style="display:flex; align-items:center; gap: 12px;">
      <a href="index.html" class="btn-action btn-secondary">🔙 Trang Chủ</a>
      <h3 style="margin:0; font-size: 18px; color: var(--tram-red);">📒 SỔ TAY SỬA LỖI TỔNG HỢP</h3>
    </div>
    <div style="display:flex; gap: 8px;">
      <button class="btn-action" onclick="window.print()"><i class="fa-solid fa-print"></i> In / Xuất PDF</button>
      <button class="btn-action" style="background:#16A34A; border-bottom-color:#14532D;" onclick="toggleAddBox()">
        <i class="fa-solid fa-plus"></i> Ghi chú lỗi mới
      </button>
    </div>
  </div>

  <!-- KHUNG THÊM LỖI SAI MỚI -->
  <div id="addErrorBox" class="card no-print" style="display: none;">
    <h4 style="margin: 0 0 12px 0; font-size: 16px; color: var(--tram-red);">✍️ Thêm lỗi sai cần nhớ:</h4>
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 12px;">
      <div>
        <label style="font-size: 12px; font-weight: 800;">Học phần:</label>
        <select id="errModule" class="input-field">
          <option value="reading">IELTS Reading</option>
          <option value="listening">IELTS Listening</option>
          <option value="grammar">Ngữ pháp (Grammar)</option>
          <option value="writing_t1">Writing Task 1</option>
          <option value="writing_t2">Writing Task 2</option>
          <option value="vocab">Từ vựng (Vocab)</option>
        </select>
      </div>
      <div>
        <label style="font-size: 12px; font-weight: 800;">Tên đề / Câu số:</label>
        <input type="text" id="errTitle" class="input-field" placeholder="VD: Cam 20 Test 2 Passage 1 - Câu 14">
      </div>
    </div>

    <label style="font-size: 12px; font-weight: 800;">Đáp án em đã làm sai ➔ Đáp án đúng là:</label>
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 12px;">
      <input type="text" id="errWrong" class="input-field" placeholder="Đáp án sai em chọn (VD: TRUE)..." style="background: #FEF2F2; color: #991B1B;">
      <input type="text" id="errCorrect" class="input-field" placeholder="Đáp án đúng chuẩn (VD: NOT GIVEN)..." style="background: #F0FDF4; color: #166534;">
    </div>

    <label style="font-size: 12px; font-weight: 800;">Tại sao sai? Rút kinh nghiệm gì để lần sau không vấp:</label>
    <textarea id="errReason" class="input-field" rows="3" placeholder="Ghi chú bẫy paraphrasing, từ vựng bị hiểu nhầm hoặc mạch suy nghĩ..."></textarea>

    <div style="text-align: right;">
      <button class="btn-action" style="background: #16A34A; border-bottom-color:#14532D;" onclick="saveNewError()">💾 Lưu vào sổ tay</button>
    </div>
  </div>

  <!-- BỘ LỌC KỸ NĂNG -->
  <div style="display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;" class="no-print">
    <button class="filter-btn active" onclick="filterNotes('all', this)">Tất cả</button>
    <button class="filter-btn" onclick="filterNotes('reading', this)">Reading</button>
    <button class="filter-btn" onclick="filterNotes('listening', this)">Listening</button>
    <button class="filter-btn" onclick="filterNotes('grammar', this)">Grammar</button>
    <button class="filter-btn" onclick="filterNotes('writing_t1', this)">Writing T1</button>
    <button class="filter-btn" onclick="filterNotes('writing_t2', this)">Writing T2</button>
  </div>

  <!-- DANH SÁCH LỖI SAI -->
  <div id="notesContainer"></div>
</div>

<script type="module">
  import { stateManager } from './js/state.js';

  let currentFilter = 'all';

  window.toggleAddBox = () => {
    const box = document.getElementById('addErrorBox');
    box.style.display = box.style.display === 'none' ? 'block' : 'none';
  };

  window.saveNewError = () => {
    const mod = document.getElementById('errModule').value;
    const title = document.getElementById('errTitle').value.trim();
    const wrong = document.getElementById('errWrong').value.trim();
    const correct = document.getElementById('errCorrect').value.trim();
    const reason = document.getElementById('errReason').value.trim();

    if (!title || !reason) {
      alert("⚠️ Em vui lòng điền ít nhất Tên đề và Lý do sai nhé!");
      return;
    }

    stateManager.saveErrorNote({
      moduleType: mod,
      testTitle: title,
      wrongAnswer: wrong,
      correctAnswer: correct,
      reasonAndTakeaway: reason
    });

    document.getElementById('errTitle').value = '';
    document.getElementById('errWrong').value = '';
    document.getElementById('errCorrect').value = '';
    document.getElementById('errReason').value = '';
    window.toggleAddBox();
    renderNotes();
  };

  window.deleteNote = (id) => {
    if (confirm("Em có muốn xóa mục ghi chú này không?")) {
      stateManager.deleteErrorNote(id);
      renderNotes();
    }
  };

  window.filterNotes = (mod, btn) => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = mod;
    renderNotes();
  };

  function renderNotes() {
    const list = stateManager.getErrorNotes();
    const filtered = currentFilter === 'all' ? list : list.filter(n => n.moduleType === currentFilter);
    const container = document.getElementById('notesContainer');

    if (filtered.length === 0) {
      container.innerHTML = `
        <div style="text-align: center; padding: 40px; background: white; border: 2.5px solid var(--duo-border); border-radius: 20px;">
          <div style="font-size: 36px; margin-bottom: 8px;">✨</div>
          <b style="font-size: 16px;">Chưa có ghi chú lỗi sai nào!</b>
          <p style="color: var(--text-muted); font-size: 13.5px; margin: 4px 0 0 0;">Bấm nút "+ Ghi chú lỗi mới" bên trên để lưu lại những câu cần nhớ sau mỗi bài thi.</p>
        </div>
      `;
      return;
    }

    container.innerHTML = filtered.map(item => `
      <div class="error-card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 10px;">
          <span style="background: #8B1518; color: white; padding: 3px 10px; border-radius: 8px; font-size: 12px; font-weight: 900; text-transform: uppercase;">
            ${item.moduleType}
          </span>
          <div style="display:flex; align-items:center; gap: 10px;">
            <span style="font-size: 12.5px; color: var(--text-muted); font-weight: 700;">📅 ${item.timestamp}</span>
            <button class="no-print" onclick="deleteNote('${item.id}')" style="background: none; border: none; color: #DC2626; cursor: pointer; font-size: 14px;" title="Xóa">🗑️</button>
          </div>
        </div>
        <h4 style="margin: 0 0 8px 0; font-size: 16px;">📝 ${item.testTitle}</h4>
        ${item.wrongAnswer || item.correctAnswer ? `
          <div style="display:flex; gap: 12px; font-size: 13.5px; margin-bottom: 10px; flex-wrap: wrap;">
            ${item.wrongAnswer ? `<span style="background:#FEE2E2; color:#991B1B; padding:3px 10px; border-radius:8px; font-weight:800;">❌ Đã chọn: ${item.wrongAnswer}</span>` : ''}
            ${item.correctAnswer ? `<span style="background:#DCFCE7; color:#166534; padding:3px 10px; border-radius:8px; font-weight:800;">✅ Đúng là: ${item.correctAnswer}</span>` : ''}
          </div>
        ` : ''}
        <div style="background: #F8FAFC; border-left: 4px solid #8B1518; padding: 10px 14px; border-radius: 6px; font-size: 14px; line-height: 1.6;">
          <b>💡 Mạch tư duy & Rút kinh nghiệm:</b><br>
          ${item.reasonAndTakeaway.replace(/\n/g, '<br>')}
        </div>
      </div>
    `).join('');
  }

  renderNotes();
</script>
</body>
</html>
